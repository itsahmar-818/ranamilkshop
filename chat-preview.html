  function tokenize(text) {

  function bot(list) {

  /* ------------------------------------------------------------------ */

  function allIds() { return CONFIG.products.map(function (p) { return p.id; }); }
  function honeyIds() { return CONFIG.products.filter(function (p) { return p.group === 'honey'; }).map(function (p) { return p.id; }); }

  function answer(intent, raw) {
    switch (intent) {
      case 'rates': return bot([{ k: 'rates', d: { t: 'ratesT', n: 1, ids: allIds() } }]);
      case 'order': return cartInfo().n ? checkout() : bot([txt('empty'), { k: 'rates', d: { t: 'ratesT', ids: allIds() } }]);
      case 'honey': return bot([{ k: 'rates', d: { t: 'honeyT', ids: honeyIds() } }]);
      case 'deliv': return bot([txt('deliv')]);
      case 'time': return bot([txt('time', { s: t(status().key) })]);
      case 'loc': return bot([txt('loc'), { k: 'act', d: [{ k: 'map' }] }]);
      case 'bulk': return bot([txt('bulk'), { k: 'act', d: [{ k: 'wa', x: t('bulkWa') }] }]);
      case 'pure': return bot([txt('pure')]);
      case 'pay': return bot([txt('pay'), { k: 'act', d: [{ k: 'wa', x: t('payWa') }] }]);
      case 'human': return bot([txt('human'), { k: 'act', d: [{ k: 'wa' }].concat(CONFIG.phones.map(function (_, i) { return { k: 'tel', i: i }; })) }]);
      case 'thanks': return bot([txt('thanks')]);
      case 'greet': return bot([txt('hello', { shop: shop() })]);
      default: return unsure(raw);
    }
  }
  function unsure(raw) {
    var fallback = function () { return bot([txt('unsure'), { k: 'act', d: [{ k: 'wa', l: 'askWa', x: raw || t('waHi') }] }]); };
    if (!CONFIG.aiEndpoint || !window.fetch) return fallback();
    var hist = S.msgs.filter(function (m) { return m.k === 't'; }).slice(-8).map(function (m) { return { role: m.r === 'u' ? 'user' : 'assistant', text: m.d }; });
    var ctl = window.AbortController ? new AbortController() : null, timer = setTimeout(function () { if (ctl) ctl.abort(); }, 15000);
    var ty = el('div', 'ty new'); ty.appendChild(el('i')); ty.appendChild(el('i')); ty.appendChild(el('i')); R.body.appendChild(ty); toEnd();
    var done = function () { clearTimeout(timer); if (ty.parentNode) ty.parentNode.removeChild(ty); };
    return fetch(CONFIG.aiEndpoint, {
      method: 'POST', headers: { 'Content-Type': 'application/json' }, signal: ctl ? ctl.signal : undefined,
      body: JSON.stringify({ message: raw, lang: S.lang, sessionId: SID, history: hist })
    }).then(function (r) { if (!r.ok) throw 0; return r.text(); }).then(function (body) {

      out = String(out || '').trim().slice(0, 1200);
      done(); if (!out) throw 0; push({ r: 'b', k: 't', d: out });
    }).catch(function () { done(); return fallback(); });
  }

  function handle(raw) {
    if (S.flow === 'name' || S.flow === 'addr') {
      if (/^(cancel|chhor|chor|rehne|nahi|نہیں|چھوڑ|رہنے)/i.test(raw.trim())) return cancelFlow();
      return S.flow === 'name' ? takeName(raw) : takeAddr(raw);
    }
    var p = parse(raw), withQty = p.items.filter(function (i) { return i.qty != null; });
    if (withQty.length) {
      if (p.priceQ) {
        return bot([txt('calc'), { k: 'calc', d: { items: withQty.map(function (i) { return { id: i.id, q: i.qty }; }) } },
          { k: 'rates', d: { ids: withQty.map(function (i) { return i.id; }) } }]);
      }
      var parts = withQty.map(function (i) { var pr = prod(i.id); S.cart[i.id] = Math.min(1000, +((S.cart[i.id] || 0) + i.qty).toFixed(2)); return (S.lang === 'ur' ? pr.ur : pr.ro) + ' ' + qtyText(pr, i.qty); });
      S.sumUp = false; save(); for (var id in steppers) steppers[id].forEach(function (fn) { fn(false); });
      paintCart(true);
      var out = [txt('added', { x: parts.join(S.lang === 'ur' ? '، ' : ', ') })];
      if (p.honeyAsk) out.push(txt('whichH'), { k: 'rates', d: { ids: honeyIds() } });
      return bot(out);
    }
    if ((p.items.length || p.honeyAsk) && !/^(bulk|deliv|time|loc|pay|pure|human)$/.test(p.intent)) {
      var ids = p.items.map(function (i) { return i.id; });
      if (p.honeyAsk) ids = ids.concat(honeyIds());
      var lead = [];
      if (ids.length === 1) { var one = prod(ids[0]); lead.push(txt('onePrice', { n: S.lang === 'ur' ? one.ur : one.ro, p: t('per', { p: money(one.price), u: unit(one) }) })); }
      else if (p.honeyAsk && !p.items.length) lead.push(txt('whichH'));
      return bot(lead.concat([{ k: 'rates', d: { ids: ids } }]));
    }
    return answer(p.intent, raw);
  }
  function submit() {
    var v = R.input.value.trim(); if (!v) return;
    R.input.value = ''; R.send.disabled = true;
    userSay(v); handle(v);
  }

  /* order bhejna */
  function checkout() {
    if (!cartInfo().n) return answer('order');
    if (S.name) { S.flow = 'addr'; paintChips(); paintCart(false); return bot([txt('askAddr', { n: S.name })]); }
    S.flow = 'name'; paintChips(); paintCart(false);
    return bot([txt('askName')]);
  }
  function takeName(v) {
    S.name = v.replace(/\s+/g, ' ').trim().slice(0, 60); save();
    S.flow = 'addr'; paintChips();
    return bot([txt('askAddr', { n: S.name })]);
  }
  function takeAddr(v) {
    var a = String(v || '').replace(/\s+/g, ' ').trim().slice(0, 220);
    if (a) S.addr = a;
    S.flow = null; S.sumUp = true; save(); paintChips();
    var items = []; for (var id in S.cart) if (prod(id)) items.push({ id: id, q: S.cart[id] });
    return bot([{ k: 'sum', d: { items: items, name: S.name, addr: a, lang: S.lang } }]).then(function () { paintCart(false); });
  }
  function cancelFlow() { S.flow = null; paintChips(); paintCart(false); return bot([txt('cancel')]); }

  /* ------------------------------------------------------------------ */
  /* Kholna aur band karna                                               */
  /* ------------------------------------------------------------------ */
  function showTeaser() {
    var seen = false; try { seen = sessionStorage.getItem('rams_teaser') === '1'; } catch (e) {}
    if (S.open || seen || S.msgs.length) return;
    var s = t('teaser'), n = el('div', 't ' + fcText(s), s), x = el('button', 'tx'); x.type = 'button'; x.setAttribute('aria-label', t('close')); x.appendChild(icon(I.x, { size: 16, w: 2 }));
    n.style.direction = isUr(s) ? 'rtl' : 'ltr';
    var gone = function () { if (n.parentNode) n.parentNode.removeChild(n); try { sessionStorage.setItem('rams_teaser', '1'); } catch (e) {} };
    x.addEventListener('click', function (e) { e.stopPropagation(); gone(); });
    n.addEventListener('click', function () { gone(); open(); });
    n.appendChild(x); root.insertBefore(n, R.launch); R.teaser = n;
    setTimeout(gone, 12000);
  }
  function open() {
    if (S.open) return; S.open = true; loadFonts();
    lastFocus = document.activeElement;
    root.classList.add('open'); R.panel.setAttribute('aria-hidden', 'false'); R.launch.setAttribute('aria-expanded', 'true'); R.launch.setAttribute('aria-label', t('close'));
    if (R.teaser && R.teaser.parentNode) { R.teaser.parentNode.removeChild(R.teaser); try { sessionStorage.setItem('rams_teaser', '1'); } catch (e) {} }
    if (mqMobile.matches) { prevOverflow = document.documentElement.style.overflow; document.documentElement.style.overflow = 'hidden'; }
    paintStatus(); toEnd(true);
    if (!S.msgs.length) setTimeout(function () { bot([txt('hello', { shop: shop() })]); }, 260);
    setTimeout(function () { try { if (mqMobile.matches) R.panel.focus({ preventScroll: true }); else R.input.focus({ preventScroll: true }); } catch (e) {} }, 380);
  }
  function close() {
    if (!S.open) return; S.open = false;
    root.classList.remove('open'); R.panel.setAttribute('aria-hidden', 'true'); R.launch.setAttribute('aria-expanded', 'false'); R.launch.setAttribute('aria-label', t('openLbl'));
    if (prevOverflow !== null) { document.documentElement.style.overflow = prevOverflow; prevOverflow = null; }
    try { R.input.blur(); (lastFocus && lastFocus.focus ? lastFocus : R.launch).focus({ preventScroll: true }); } catch (e) {}
  }
  function reset() {
    S.msgs = []; S.cart = {}; S.flow = null; save(); paintAll();
    if (S.open) bot([txt('hello', { shop: shop() })]);
  }

  window.RamsChat = { open: open, close: close, reset: reset, parse: parse, config: CONFIG };
  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', build); else build();
})();

</script>
